services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/cloud_storage/caddy_data:/data
      - /mnt/cloud_storage/caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cloud-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    networks:
      - cloud-net
    restart: unless-stopped

  minio:
    # Pinned: community MinIO releases are sparse post-AIStor; update deliberately
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - /mnt/cloud_storage/minio_data:/data
    # S3 API stays published for auto_ingestor.py LAN clients; console (9001)
    # is reached via storage.arijitroy.com only
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cloud-net
    restart: unless-stopped

  portainer:
    # Pinned: holds docker.sock — upgrades to this one should be deliberate
    image: portainer/portainer-ce:2.39.1
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/cloud_storage/portainer_data:/data
    networks:
      - cloud-net
    restart: unless-stopped

networks:
  cloud-net:
    external: true
